# Propiedades del keystore de release para LSG Routes
# Copiar como release.keystore.properties y NO commitear ese archivo.

# Ruta al archivo .jks generado con keytool
RELEASE_STORE_FILE=/path/to/lsg-routes-release.jks

# Alias de la clave dentro del keystore
RELEASE_KEY_ALIAS=lsg-routes

# Contrasenas (usar variables de entorno CI en produccion)
RELEASE_STORE_PASSWORD=changeme
RELEASE_KEY_PASSWORD=changeme

# Pasos para generar el keystore:
# keytool -genkey -v \
#   -keystore lsg-routes-release.jks \
#   -alias lsg-routes \
#   -keyalg RSA -keysize 2048 \
#   -validity 10000 \
#   -storepass <STORE_PASSWORD> \
#   -keypass <KEY_PASSWORD> \
#   -dname "CN=LSG Routes, OU=DIINF, O=USACH, L=Santiago, ST=RM, C=CL"
